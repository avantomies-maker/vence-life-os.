

<!doctype html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0d101b">

<title>LIFE OS · VENCE EDITION</title>

<style>

:root{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5fa;background:#0d101b}

*{box-sizing:border-box}

body{margin:0}

.wrap{max-width:1100px;margin:auto;padding:30px 20px 80px}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.logo{font-size:clamp(36px,8vw,62px);font-weight:950;letter-spacing:-.065em;line-height:1}

.sub{font-size:12px;letter-spacing:.15em;color:#9296a8;font-weight:800;margin-top:15px}

.pill{background:#2c3040;padding:10px 13px;border-radius:30px;font-size:10px;font-weight:900;white-space:nowrap}

.hero{height:200px;margin:25px 0 22px;border:1px solid #454a58;border-radius:24px;overflow:hidden;position:relative;background:#555}

.hero svg{width:100%;height:100%;display:block}

.streak{position:absolute;bottom:20px;left:22px;background:#1b1d25;border-radius:50px;padding:12px 22px;font-size:26px;font-weight:900}

.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.ringcard{background:#222737;border-radius:23px;padding:20px 8px;text-align:center}

.ring{--color:#ad83ff;--p:0;aspect-ratio:1;width:min(100%,150px);border-radius:50%;background:conic-gradient(var(--color) calc(var(--p)*1%),#40475a 0);display:grid;place-items:center;margin:0 auto 13px}

.inside{width:77%;height:77%;border-radius:50%;display:grid;place-items:center;background:#222737;font-size:clamp(20px,4.2vw,34px);font-weight:900}

.ringcard strong{font-size:15px}

.panel{background:#222737;border-radius:24px;padding:22px;margin-top:20px}

.panelhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.panel h2{margin:0;font-size:clamp(20px,4vw,28px);letter-spacing:-.04em}

.muted{color:#a4a8b8;font-size:13px}

.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:5px;margin-top:25px}

.cell{aspect-ratio:1;border-radius:4px;background:#3b4355}

.cell[data-v="1"]{background:#665186}

.cell[data-v="2"]{background:#8763bf}

.cell[data-v="3"]{background:#b48af4}

.cell[data-v="4"]{background:#d4b9ff}

.cell.future{opacity:.3}

.legend{display:flex;gap:7px;align-items:center;justify-content:flex-end;margin-top:12px}

.legend .cell{width:12px;height:12px}

.habit{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid #3a4051}

.habit:last-child{border:0}

.check{width:28px;height:28px;accent-color:#ae83ff;flex-shrink:0}

.habitmain{flex:1;min-width:0}

.habitname{font-weight:750}

.hint{font-size:12px;color:#a4a8b8;margin-top:4px}

.timer{background:#353d52;color:white;border:0;border-radius:12px;padding:10px 12px;font-size:13px;min-width:85px}

.timer.running{background:#57467c}

.status{padding:12px 0;font-size:13px;color:#a4a8b8}

.error{color:#ff9c9c}

.foot{font-size:12px;color:#878da0;margin-top:25px;text-align:center}

button{cursor:pointer}

button:disabled,input:disabled{opacity:.55;cursor:wait}

@media(min-width:700px){.wrap{padding:50px 32px}.hero{height:310px}.rings{gap:20px}.ringcard{padding:25px}.panel{padding:30px}.heat{gap:9px}.pill{font-size:13px}}

</style>

</head>

<body>

<main class="wrap">

<header class="head">

<div>

<div class="logo">LIFE OS.</div>

<div class="sub">BUILD THE LIFE YOU WANT.</div>

</div>

<div class="pill">VENCE EDITION</div>

</header>

<div class="hero">

<svg viewBox="0 0 900 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#282a31"/><stop offset="1" stop-color="#d5d6d5"/></linearGradient></defs>

<rect width="900" height="320" fill="url(#sky)"/>

<path d="M0 200 80 135 130 165 205 110 265 178 320 148 375 185 430 150 510 215 580 168 620 183 690 115 750 165 825 140 900 180V320H0" fill="#45494e"/>

<path d="M0 230 85 200 160 222 230 184 300 228 400 185 500 240 600 180 700 215 785 168 900 210V320H0" fill="#888b8c"/>

<path d="M0 255 115 230 240 260 330 215 445 270 560 238 670 270 800 220 900 255V320H0" fill="#5b6065"/>

<path d="M0 286 125 265 245 300 360 280 490 316 610 290 740 320 900 292V320H0" fill="#20242b"/>

</svg>

<div class="streak" id="streak">0x</div>

</div>

<div class="rings">

<div class="ringcard"><div class="ring" id="rday" style="--color:#ad83ff"><div class="inside" id="day">—</div></div><strong>Today</strong></div>

<div class="ringcard"><div class="ring" id="rweek" style="--color:#77d8a4"><div class="inside" id="week">—</div></div><strong>Week</strong></div>

<div class="ringcard"><div class="ring" id="rmonth" style="--color:#7ab5ff"><div class="inside" id="month">—</div></div><strong>Month</strong></div>

</div>

<section class="panel">

<div class="panelhead"><h2>Consistency heatmap</h2><span class="muted">Last 12 weeks</span></div>

<div class="heat" id="heat"></div>

<div class="legend"><span class="muted">Less</span><div class="cell"></div><div class="cell" data-v="1"></div><div class="cell" data-v="2"></div><div class="cell" data-v="3"></div><div class="cell" data-v="4"></div><span class="muted">More</span></div>

</section>

<section class="panel">

<div class="panelhead"><h2>Today's checklist</h2><span class="muted" id="date"></span></div>

<div id="habits"></div>

<div class="status" id="status">Connecting to Notion…</div>

</section>

<div class="foot">LIFE OS · VENCE EDITION · Powered by Notion</div>

</main>

<script>

const labels=[

'Take Vitamins','Back Roller','Back Workout',

'Stretching','Leg Day','Core / Abs','Chest Workout'

];

const workouts=[

'Rest Day','Back Workout','Stretching','Leg Day',

'Core / Abs','Chest Workout','Rest Day'

];

const $=id=>document.getElementById(id);

const pad=n=>String(n).padStart(2,'0');

const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const fromIso=s=>new Date(s+'T12:00:00');

let state=null;

let activeTimer=null;

function scheduled(date){

const day=fromIso(date).getDay();

return ['Take Vitamins','Back Roller',...(day>0&&day<6?[workouts[day]]:[])];

}

function normalizeLog(raw){

if(!raw||typeof raw!=='object'||typeof raw.date!=='string')return null;

const date=raw.date.slice(0,10);

if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;

const source=raw.checks&&typeof raw.checks==='object'?raw.checks:raw;

const checks={};

for(const name of labels)checks[name]=source[name]===true;

return {id:raw.id,date,checks};

}

function normalizeState(payload){

if(!payload||payload.ok===false)throw Error(payload?.error||'API error');

const records=Array.isArray(payload.days)?payload.days:

Array.isArray(payload.logs)?payload.logs:null;

if(!records)throw Error('Unexpected API response: missing days/logs');

if(!/^\d{4}-\d{2}-\d{2}$/.test(payload.today||'')){

throw Error('Invalid server date');

}

return {today:payload.today,logs:records.map(normalizeLog).filter(Boolean)};

}

function percent(log){

if(!log)return 0;

const names=scheduled(log.date);

return Math.round(100*names.filter(name=>log.checks?.[name]===true).length/names.length);

}

function ring(id,value){

$(id).textContent=value+'%';

$('r'+id).style.setProperty('--p',value);

}

function render(){

if(!state)return;

const now=state.today;

const current=fromIso(now);

const map=new Map(state.logs.map(log=>[log.date,log]));

const today=map.get(now)||{date:now,checks:{}};

ring('day',percent(today));

const monday=new Date(current);

monday.setDate(current.getDate()-((current.getDay()+6)%7));

const weekDates=[];

for(let d=new Date(monday);d<=current;d.setDate(d.getDate()+1)){

weekDates.push(iso(d));

}

const monthDates=[];

for(let n=1;n<=current.getDate();n++){

monthDates.push(now.slice(0,7)+'-'+pad(n));

}

function average(dates){

if(!dates.length)return 0;

const sum=dates.reduce((total,date)=>

total+percent(map.get(date)||{date,checks:{}}),0);

return Math.round(sum/dates.length);

}

ring('week',average(weekDates));

ring('month',average(monthDates));

let streak=0;

for(let d=new Date(current),i=0;i<1000;i++,d.setDate(d.getDate()-1)){

const key=iso(d);

if(!map.has(key)||percent(map.get(key))!==100)break;

streak++;

}

$('streak').textContent=streak+'x';

$('date').textContent=now;

const heat=$('heat');

heat.replaceChildren();

const start=new Date(current);

start.setDate(current.getDate()-((current.getDay()+6)%7)-77);

for(let i=0;i<84;i++){

const d=new Date(start);

d.setDate(start.getDate()+i);

const key=iso(d);

const log=map.get(key);

const value=log?Math.ceil(percent(log)/25):0;

const cell=document.createElement('div');

cell.className='cell'+(key>now?' future':'');

if(log&&value>0)cell.dataset.v=String(value);

cell.title=key+': '+(log?percent(log)+'%':'No entry');

heat.append(cell);

}

const container=$('habits');

container.replaceChildren();

for(const name of scheduled(now)){

const row=document.createElement('div');

row.className='habit';

const checkbox=document.createElement('input');

checkbox.type='checkbox';

checkbox.className='check';

checkbox.checked=!!today.checks[name];

checkbox.setAttribute('aria-label','Complete '+name);

checkbox.onchange=()=>toggle(name,checkbox.checked,checkbox);

const main=document.createElement('div');

main.className='habitmain';

const title=document.createElement('div');

title.className='habitname';

title.textContent=name;

main.append(title);

if(name==='Back Roller'){

const hint=document.createElement('div');

hint.className='hint';

hint.textContent='5-minute timer · Mark complete manually';

main.append(hint);

}

row.append(checkbox,main);

if(name==='Back Roller'){

const button=document.createElement('button');

button.className='timer';

button.textContent='Start 5:00';

button.onclick=()=>startTimer(button);

row.append(button);

}

container.append(row);

}

$('status').textContent='Connected to Notion · Checkmarks save automatically';

$('status').className='status';

}

async function toggle(field,checked,checkbox){

checkbox.disabled=true;

$('status').textContent='Saving to Notion…';

$('status').className='status';

try{

const response=await fetch('/api/state',{

method:'POST',

headers:{'Content-Type':'application/json'},

body:JSON.stringify({

date:state.today,

habit:field,

field:field,

checked:checked

})

});

const result=await response.json();

if(!response.ok||result.ok===false){

throw Error(result.error||'Save failed');

}

const verify=await fetch('/api/state',{cache:'no-store'});

const payload=await verify.json();

if(!verify.ok)throw Error(payload.error||'Verification failed');

const updated=normalizeState(payload);

const day=updated.logs.find(log=>log.date===updated.today);

if(!day||day.checks[field]!==checked){

throw Error('Notion did not confirm the change');

}

state=updated;

render();

}catch(error){

checkbox.checked=!checked;

$('status').textContent='Could not save: '+error.message;

$('status').className='status error';

}finally{

checkbox.disabled=false;

}

}

function startTimer(button){

if(activeTimer){

clearInterval(activeTimer.interval);

activeTimer.button.textContent='Start 5:00';

activeTimer.button.classList.remove('running');

activeTimer=null;

}

const end=Date.now()+300000;

button.classList.add('running');

function tick(){

const remaining=Math.max(0,Math.ceil((end-Date.now())/1000));

button.textContent=remaining?

`${Math.floor(remaining/60)}:${pad(remaining%60)}`:'Done ✓';

if(!remaining){

clearInterval(timer.interval);

button.classList.remove('running');

activeTimer=null;

}

}

const timer={button,interval:setInterval(tick,250)};

activeTimer=timer;

tick();

}

async function load(){

try{

const response=await fetch('/api/state',{cache:'no-store'});

const payload=await response.json();

if(!response.ok)throw Error(payload.error||'Request failed');

state=normalizeState(payload);

render();

}catch(error){

$('status').textContent='Notion connection error: '+error.message;

$('status').className='status error';

}

}

load();

</script>

</body>

</html>
