<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d101b"><title>LIFE OS · VENCE EDITION</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f5f5fa;background:#0d101b}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:30px 20px 80px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.logo{font-weight:950;letter-spacing:-.065em;font-size:clamp(36px,8vw,62px);line-height:1}.sub{font-size:13px;letter-spacing:.2em;color:#9296a8;font-weight:800;margin-top:15px}.pill{background:#2c3040;padding:10px 15px;border-radius:30px;letter-spacing:.09em;font-size:11px;font-weight:900;white-space:nowrap}.hero{margin:25px 0 22px;border:1px solid #454a58;border-radius:24px;overflow:hidden;position:relative;height:200px;background:linear-gradient(#3a3c44,#888b8d)}.hero svg{width:100%;height:100%;display:block}.streak{position:absolute;bottom:20px;left:22px;background:#1b1d25;border-radius:50px;padding:12px 22px;font-size:26px;font-weight:900}.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ringcard{background:#222737;border-radius:23px;padding:20px 8px;text-align:center}.ring{--color:#ad83ff;--p:0;aspect-ratio:1;width:min(100%,150px);border-radius:50%;background:conic-gradient(var(--color) calc(var(--p)*1%),#40475a 0);display:grid;place-items:center;margin:0 auto 13px}.ring:before{content:'';position:absolute}.inside{width:77%;height:77%;border-radius:50%;display:grid;place-items:center;background:#222737;font-size:clamp(20px,4.2vw,34px);font-weight:900}.ringcard strong{font-size:15px}.panel{background:#222737;border-radius:24px;padding:22px;margin-top:20px}.panelhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.panel h2{margin:0;font-size:clamp(20px,4vw,28px);letter-spacing:-.04em}.muted{color:#a4a8b8;font-size:13px}.heat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:5px;margin-top:25px}.cell{aspect-ratio:1;border-radius:4px;background:#3b4355}.cell[data-v="1"]{background:#665186}.cell[data-v="2"]{background:#8763bf}.cell[data-v="3"]{background:#b48af4}.cell[data-v="4"]{background:#d4b9ff}.cell.future{opacity:.3}.legend{display:flex;gap:7px;align-items:center;justify-content:flex-end;margin-top:12px}.legend .cell{width:12px;height:12px}.habit{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid #3a4051}.habit:last-child{border:0}.check{width:28px;height:28px;accent-color:#ae83ff;flex-shrink:0}.habitmain{flex:1;min-width:0}.habitname{font-weight:750}.hint{font-size:12px;color:#a4a8b8;margin-top:4px}.timer{background:#353d52;color:white;border:0;border-radius:12px;padding:10px 12px;font-size:13px;min-width:85px}.timer.running{background:#57467c}.status{padding:12px 0;font-size:13px;color:#a4a8b8}.error{color:#ff9c9c}.foot{font-size:12px;color:#878da0;margin-top:25px;text-align:center}button{cursor:pointer}button:disabled,input:disabled{opacity:.55;cursor:wait}@media(min-width:700px){.wrap{padding:50px 32px}.hero{height:310px}.rings{gap:20px}.ringcard{padding:25px}.panel{padding:30px}.heat{gap:9px}.pill{font-size:13px}}
</style></head><body><main class="wrap"><div class="head"><div><div class="logo">LIFE OS.</div><div class="sub">BUILD THE LIFE YOU WANT.</div></div><div class="pill">VENCE EDITION</div></div><div class="hero"><svg viewBox="0 0 900 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#282a31"/><stop offset="1" stop-color="#d5d6d5"/></linearGradient></defs><rect width="900" height="320" fill="url(#sky)"/><path d="M0 200 80 135 130 165 205 110 265 178 320 148 375 185 430 150 510 215 580 168 620 183 690 115 750 165 825 140 900 180V320H0" fill="#45494e"/><path d="M0 230 85 200 160 222 230 184 300 228 400 185 500 240 600 180 700 215 785 168 900 210V320H0" fill="#888b8c"/><path d="M0 255 115 230 240 260 330 215 445 270 560 238 670 270 800 220 900 255V320H0" fill="#5b6065"/><path d="M0 286 125 265 245 300 360 280 490 316 610 290 740 320 900 292V320H0" fill="#20242b"/></svg><div class="streak" id="streak">0x</div></div><div class="rings"><div class="ringcard"><div class="ring" id="rday" style="--color:#ad83ff"><div class="inside" id="day">0%</div></div><strong>Today</strong></div><div class="ringcard"><div class="ring" id="rweek" style="--color:#77d8a4"><div class="inside" id="week">0%</div></div><strong>Week</strong></div><div class="ringcard"><div class="ring" id="rmonth" style="--color:#7ab5ff"><div class="inside" id="month">0%</div></div><strong>Month</strong></div></div><section class="panel"><div class="panelhead"><h2>Consistency heatmap</h2><span class="muted">Last 12 weeks</span></div><div class="heat" id="heat"></div><div class="legend"><span class="muted">Less</span><div class="cell"></div><div class="cell" data-v="1"></div><div class="cell" data-v="2"></div><div class="cell" data-v="3"></div><div class="cell" data-v="4"></div><span class="muted">More</span></div></section><section class="panel"><div class="panelhead"><h2>Today's checklist</h2><span class="muted" id="date"></span></div><div id="habits"></div><div class="status" id="status">Connecting to Notion…</div></section><div class="foot">LIFE OS · VENCE EDITION · Powered by Notion</div></main><script>
const labels=['Take Vitamins','Back Roller','Back Workout','Stretching','Leg Day','Core / Abs','Chest Workout'];let state=null;const $=id=>document.getElementById(id);const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const fromIso=s=>new Date(s+'T12:00:00');const days=['Rest Day','Back Workout','Stretching','Leg Day','Core / Abs','Chest Workout','Rest Day'];function scheduled(s){const d=fromIso(s).getDay();return ['Take Vitamins','Back Roller',...(d>0&&d<6?[days[d]]:[])];}function percent(log){if(!log)return 0;const list=scheduled(log.date);return Math.round(list.filter(x=>log.checks[x]).length/list.length*100)}function ring(id,n){$(id).textContent=n+'%';$('r'+id).style.setProperty('--p',n)}function render(){if(!state)return;const now=state.today;const map=new Map(state.logs.map(x=>[x.date,x]));const today=map.get(now)||{date:now,checks:{}};ring('day',percent(today));const current=fromIso(now),dow=(current.getDay()+6)%7;const monday=new Date(current);monday.setDate(monday.getDate()-dow);const month=now.slice(0,7);const avg=dates=>dates.length?Math.round(dates.reduce((s,d)=>s+percent(map.get(d)||{date:d,checks:{}}),0)/dates.length):0;const weekDates=[],monthDates=[];for(let d=new Date(monday);d<=current;d.setDate(d.getDate()+1))weekDates.push(iso(d));for(let n=1;n<=current.getDate();n++)monthDates.push(month+'-'+String(n).padStart(2,'0'));ring('week',avg(weekDates));ring('month',avg(monthDates));let streak=0;for(let d=new Date(current);;d.setDate(d.getDate()-1)){const key=iso(d);if(!map.has(key)||percent(map.get(key))!==100)break;streak++;if(streak>1000)break;}$('streak').textContent=streak+'x';$('date').textContent=now;const heat=$('heat');heat.replaceChildren();const start=new Date(current);start.setDate(start.getDate()-((start.getDay()+6)%7)-77);for(let i=0;i<84;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),l=map.get(key),v=l?Math.max(1,Math.ceil(percent(l)/25)):0;const cell=document.createElement('div');cell.className='cell'+(key>now?' future':'');if(l)cell.dataset.v=String(v);cell.title=key+': '+(l?percent(l)+'%':'No entry');heat.append(cell)}const hab=$('habits');hab.replaceChildren();for(const name of scheduled(now)){const row=document.createElement('div');row.className='habit';const box=document.createElement('input');box.type='checkbox';box.className='check';box.checked=!!today.checks[name];box.setAttribute('aria-label','Complete '+name);box.onchange=()=>toggle(name,box.checked,box);const main=document.createElement('div');main.className='habitmain';const title=document.createElement('div');title.className='habitname';title.textContent=name;main.append(title);if(name==='Back Roller'){const hint=document.createElement('div');hint.className='hint';hint.textContent='5-minute timer · Mark complete manually';main.append(hint)}row.append(box,main);if(name==='Back Roller'){const btn=document.createElement('button');btn.className='timer';btn.textContent='Start 5:00';btn.onclick=()=>startTimer(btn);row.append(btn)}hab.append(row)}$('status').textContent='Synced with Notion · Checkmarks save automatically';$('status').className='status'}async function toggle(field,checked,box){box.disabled=true;$('status').textContent='Saving to Notion…';try{const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:state.today,field,checked})});const j=await r.json();if(!r.ok)throw Error(j.error||'Save failed');state.logs=state.logs.filter(x=>x.date!==state.today);state.logs.push(j.log);render()}catch(e){box.checked=!checked;$('status').textContent='Could not save: '+e.message;$('status').className='status error'}finally{box.disabled=false}}let activeTimer=null;function startTimer(btn){if(activeTimer){clearInterval(activeTimer.interval);activeTimer.btn.textContent='Start 5:00';activeTimer.btn.classList.remove('running');activeTimer=null}let end=Date.now()+300000;btn.classList.add('running');function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000));btn.textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'Done ✓';if(!left){clearInterval(activeTimer.interval);btn.classList.remove('running');activeTimer=null}}activeTimer={btn,interval:setInterval(tick,250)};tick()}async function load(){try{const r=await fetch('/api/state',{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');state=j;render()}catch(e){$('status').textContent='Notion connection error: '+e.message;$('status').className='status error'}}load();
</script></body></html>
